<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; media-src data:; connect-src 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ludens</title>
  <link rel="stylesheet" href="pet.css">
</head>
<body>
  <div id="mirror">
    <div id="body">
      <div id="bubble" aria-live="polite" aria-hidden="true">
        <img class="bubble-main" src="bubble-speech.png" alt="" draggable="false">
        <div id="message"></div>
        <div id="activity-actions" hidden><button id="activity-open" type="button">Details <span aria-hidden="true">↗</span></button><button id="activity-dismiss" type="button" aria-label="Dismiss this activity" title="Dismiss this activity">Dismiss</button></div>
      </div>
      <button id="pet" aria-label="Ludens: click to interact, drag to move, right-click for settings and games" title="Click to interact · Drag to move · Right-click for games & settings">
        <img id="portrait" src="ludens/states/01-idle.webp" alt="Ludens" draggable="false">
        <img id="effect" alt="" hidden draggable="false">
      </button>
    </div>
  </div>
  <div id="game" role="group" aria-label="Catch the Stars" hidden>
    <div id="game-hud" aria-live="off"><span id="game-score">★ 0 / 10</span><span id="game-time">20.0s</span></div>
    <button id="game-target" type="button" aria-label="Catch the star" title="Catch the star" hidden><img src="ludens/effects/fx-stars.webp" alt="" draggable="false"></button>
  </div>
  <script src="companion-i18n.cjs"></script>
  <script src="log-content.js"></script>
  <script src="ludens/catalog.js"></script>
  <script src="pet-state.js"></script>
  <script src="pet.js"></script>
</body>
</html>
